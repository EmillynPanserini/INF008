services:
  mariadb:
    image: mariadb
    container_name: bookstore-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookstore
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - "/mnt/c/Users/MyByte 2/IdeaProjects/INF008/docker-T2/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"

volumes:
  db_data:
